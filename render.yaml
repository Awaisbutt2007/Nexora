# Render blueprint — deploy the Nexora backend (Express + SQLite) as one web
# service from this repo. Render reads the root Dockerfile, which builds the React
# client AND runs the API that also hosts it, so this service works standalone at
# its own https://….onrender.com URL (relative /api, no CORS).
#
# It is ALSO wired to serve the EXISTING Vercel frontend: CORS_ORIGIN below lists
# the Vercel production URL, and the Vercel build sets VITE_API_URL to this
# service's URL, so the Vercel page calls /api here (memory, chat, credits, voice).
#
# PERSISTENCE: memories/accounts/conversations live in the SQLite file at DB_PATH,
# which sits on the mounted disk. The $0 free tier has NO disk and sleeps, so data
# would reset on every restart — this blueprint therefore uses the `starter` plan
# ($7/mo, needs a card) with a real disk. To trial it for $0 instead, set plan back
# to `free` and delete the `disk` block, accepting that data resets on restart.
services:
  - type: web
    name: nexora
    runtime: docker
    plan: starter            # persistent-instance tier required for the disk below
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: nexora-data
      mountPath: /data
      sizeGB: 1              # SQLite file + uploads survive redeploys/restarts on this volume
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/nexora.db
      # A strong secret, generated once by Render and kept out of the repo.
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b
      - key: AI_FALLBACK_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: AI_DAILY_TOKEN_LIMIT
        value: "200000"
      # Render's load balancer sits in front, so the rate limiter must read the real client IP.
      - key: TRUST_PROXY
        value: "true"
      - key: AI_DEVELOPER_NAME
        value: Awais
      # The Vercel frontend calls this API cross-origin, so its exact production
      # origin must be allowed here. Render's own origin works same-origin and
      # needs no listing. Change this if you ever move off the Vercel URL.
      - key: CORS_ORIGIN
        value: https://nexora-opal-beta-29.vercel.app
      # Secrets you fill in from the Render dashboard (never committed):
      - key: OPENAI_API_KEY
        sync: false          # paste your Groq key here
