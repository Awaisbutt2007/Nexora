# Render blueprint — deploy the whole app (frontend + API) as ONE web service
# from this repo. Render reads the root Dockerfile and runs Express, which ALSO
# hosts the built React client, so a deployed page calls relative /api URLs.
#
# FREE-TIER note: this is configured for the $0 plan so it deploys without a
# card. The free tier has NO persistent disk and sleeps when idle, so accounts
# and conversations reset on a redeploy/restart and the first request after a
# nap takes ~50s to wake. To keep data permanently, change `plan` to `starter`
# below and add back the `disk` block.
services:
  - type: web
    name: nexora
    runtime: docker
    plan: free               # $0 tier; no persistent disk (data resets on restart)
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/nexora.db
      # A strong secret, generated once by Render and kept out of the repo.
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b
      - key: AI_FALLBACK_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: AI_DAILY_TOKEN_LIMIT
        value: "200000"
      # Render's load balancer sits in front, so the rate limiter must read the real client IP.
      - key: TRUST_PROXY
        value: "true"
      - key: AI_DEVELOPER_NAME
        value: Awais
      # Secrets / late-bound values you fill in from the Render dashboard:
      - key: OPENAI_API_KEY
        sync: false          # paste your Groq key here (never committed)
      # CORS_ORIGIN is left unset on purpose: the client is served by THIS same
      # service (single origin), and backend/src/config.js falls back to Render's
      # RENDER_EXTERNAL_URL, so the production boot guard passes without a manual step.
